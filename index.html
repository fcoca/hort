<title>El meu hort</title>
<style>
:root{--bg:#f4ecdc;--card:#fbf6ea;--tx:#3a2c20;--mu:#7b6a57;--ac:#2f4a33;--on:#f4ecdc;--ol:#6b7a3a;--te:#b5573a;--bd:#dccfb4;--soil:#d8c3a0;--grow:#b9c27f;--rdy:#e3a46f;--er:#a8472e;--v2b:#dde4c2;--v2c:#2f4a33;--v1b:#eaeed4;--v1c:#4a5a28;--vxb:#efd5c8;--vxc:#7a2f1b;--vwb:#e6dec3;--vwc:#5a4a2a;--ser:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
@media(prefers-color-scheme:dark){:root{--bg:#1e1a14;--card:#27221a;--tx:#eee2cc;--mu:#a99b83;--ac:#9dc2a4;--on:#1e1a14;--ol:#a8b567;--te:#d98462;--bd:#3d3528;--soil:#5c4a33;--grow:#56633a;--rdy:#9c6a3a;--er:#e08a6c;--v2b:#34402c;--v2c:#cfe3c4;--v1b:#2e3524;--v1c:#c9d6a2;--vxb:#4a2c22;--vxc:#f0c2ae;--vwb:#3b3425;--vwc:#e6d6a8}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 88px}
header{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--bd);margin-bottom:14px}
h1{font:600 24px/1 var(--ser);letter-spacing:.2px;margin:0}
.ic{display:inline-block;vertical-align:-4px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.iu{stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0);z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;border-top:2px solid transparent;background:none;color:var(--mu);padding:9px 0 8px;font:inherit;font-size:11px;letter-spacing:.3px}
nav button.on{color:var(--ac);border-top-color:var(--te)}nav .ic{stroke-width:1.6}
main{padding:0 14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.card>b,.cr b{font-family:var(--ser);font-weight:600;font-size:17px}
.b,select,input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 11px}
.b{cursor:pointer;display:inline-flex;align-items:center;gap:6px;background:transparent}
.p{background:var(--ac);color:var(--on);border-color:var(--ac)}.d{color:var(--er)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:7px 0}.g1{flex:1;min-width:0}
#sv{width:100%;height:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;touch-action:pan-y;display:block}
#sv.ed{touch-action:none}
.ci{display:inline-block;vertical-align:-5px;flex:none}
.mu{color:var(--mu);font-size:14px}
.hist{font-size:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed var(--bd);padding:5px 0}
.hist button{border:0;background:none;color:var(--mu);padding:2px 4px}
label{font-size:13px;color:var(--mu)}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;background:var(--bg);border:1px solid var(--bd)}
.cr{border:1px solid var(--bd);border-radius:10px;padding:9px 11px;margin:9px 0}
.v{border-radius:8px;padding:8px 11px;margin:9px 0;font-weight:500;display:flex;align-items:center;gap:8px}
.v2{background:var(--v2b);color:var(--v2c)}.v1{background:var(--v1b);color:var(--v1c)}.v0{background:transparent;border:1px solid var(--bd)}.v-1{background:var(--vxb);color:var(--vxc)}.vw{background:var(--vwb);color:var(--vwc)}
.dt{font-weight:400;letter-spacing:1px}.d2{color:var(--ac)}.d1{color:var(--ol)}.d0{color:var(--mu)}.dx{color:var(--te)}
.ph{width:96px;height:96px;border-radius:10px;background:var(--bg);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden;flex:none}.ph img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--ac);color:var(--on);padding:8px 16px;border-radius:99px;font-size:14px;z-index:9;max-width:90%;text-align:center}
</style></head><body>

/* --- Rotacio (agricultura regenerativa) --- */
function dem(n){const f=(CROPS[n]||[])[3];if(!f||/^Brots/.test(n))return null;
 const o={"Rave":1,"Ravenet":1,"Daikon":1,"Ruca":1,"Créixens":1,"Fulles de mostassa":1,"Mizuna":1,"Komatsuna":2,"Pak choi":2,"Bok choy":2,"Tatsoi":2,"Pastanaga":1,"Xirivia":2,"Salsifí":1,"Escorçonera":1,"Carxofa":3,"Card":3,"Api":3,"Api-rave":3,"Patata":3,"Blat de moro dolç":3,"Moniato":2,"Batata":2,"Remolatxa":2,"Fonoll":2,"Maduixa":2};
 if(o[n]!==undefined)return o[n];
 const g={"Lleguminoses":0,"Solanàcies":3,"Cucurbitàcies":3,"Crucíferes":3,"Poàcies":3,"Al·liàcies":1,"Lamiàcies":1,"Boraginàcies":1,"Asteràcies":1}[f];return g===undefined?2:g}
function rotAnalyze(b,cand){
 const R=ret(b),t=today(),cur=cand?[cand]:(b.crops||[]).map(c=>c.crop),it=[],prev=R[0];
 cur.forEach(n=>{const f=FAM[n],d=dem(n);if(d===null)return;
  const rep=R.find(r=>FAM[r.n]&&FAM[r.n]==f&&diff(r.d,t)<=1095);
  if(rep)it.push(["e",`${n}: mateixa família (${f}) que ${rep.n} (${fmt(rep.d)}). Espera 3 anys per evitar plagues i esgotament.`]);
  if(prev&&dem(prev.n)!==null){const pd=dem(prev.n);
   if(d==3&&pd==3)it.push(["w",`${prev.n} → ${n}: dos cultius molt exigents seguits. Intercala una lleguminosa o un cultiu lleuger.`]);
   else if(d==0&&pd>=2)it.push(["g",`${n} després de ${prev.n}: la lleguminosa repara el sòl.`]);
   else if(d==3&&pd==0)it.push(["g",`${n} aprofita el nitrogen que va deixar ${prev.n}.`]);
   else if(d<pd&&pd>=2)it.push(["g",`${prev.n} → ${n}: baixes l’exigència, bé per al sòl.`])}});
 if(!cand){const fams=new Set(R.slice(0,4).map(r=>FAM[r.n]).concat(cur.map(n=>FAM[n])).filter(Boolean));
  if(R.length>=2&&fams.size<3)it.push(["w","Poca diversitat de famílies: amplia-la (mínim 4 en rotació) per a un sòl més viu."]);
  if(!cur.length)it.push(["i","Terra sense cultiu: cobreix-la amb un adob verd (faves, veça, mostassa o fenigrec) perquè no quedi nua."]);
  if(!R.length&&cur.length)it.push(["i","Encara no hi ha historial: la rotació es valorarà quan retiris cultius."]);
  if(cur.length&&R.length&&!it.some(x=>x[0]=="e"||x[0]=="w"||x[0]=="g"))it.push(["g","Cap problema detectat amb l’historial actual."])}
 return{it,v:(!cand&&!cur.length)?"n":it.some(x=>x[0]=="e")?"e":it.some(x=>x[0]=="w")?"w":it.some(x=>x[0]=="g")?"g":"i"}}
const COMMON=["Mongeta tendra","Pèsol","Fava","Pastanaga","Enciam","Ceba","Porro","All","Bleda","Espinac","Remolatxa","Col","Bròquil","Coliflor","Tomàquet","Pebrot","Albergínia","Carabassó","Cogombre","Patata","Julivert","Rave","Api","Meló","Fonoll","Alfàbrega"];

 const bd=dem(base),tg=bd==3?[2,0]:bd==2?[1,0]:bd==1?[0,3]:[3,2],t=today(),used=new Set(R.filter(r=>diff(r.d,t)<=1095).map(r=>FAM[r.n]).concat(cur.map(n=>FAM[n])));

function rotBlock(b,rt){const ra=rotAnalyze(b),nc=nextCrops(b),T={e:["v v-1","Convé corregir la rotació"],w:["v vw","Rotació millorable"],g:["v v2","Bona rotació"],i:["v v0","Sense dades suficients"],n:["v vw","Terra sense cobertura"]}[ra.v],K={e:["dx","✕"],w:["d1","!"],g:["d2","●"],i:["d0","○"]};

 +`<div class="mu" style="margin-top:6px">Criteris: no repetir família en 3 anys, alternar cultius exigents amb lleguminoses i lleugers, i no deixar el sòl nu.</div>`}

 <div class="card"><b>Fotos dels cultius</b><div class="mu">Les fotos vénen de la Viquipèdia. Descarrega-les un cop amb connexió i després es veuran també sense internet.</div><div class="row"><button class="b" id="ph">Descarrega les fotos</button></div><div class="mu" id="pg"></div></div>
 <div class="card"><b>Còpia de seguretat</b><div class="mu">Les dades es guarden només en aquest navegador. Fes-ne una còpia de tant en tant.</div>
 <div class="row"><button class="b" id="ex">Exportar dades</button><button class="b" id="im">Importar dades</button><input type="file" id="fi" accept=".json" hidden></div></div>`;
 const gd=(k,id)=>$(id).onchange=e=>{const v=Math.max(1,Math.min(200,+e.target.value||G()[k]));G()[k]=v;
  S.beds.forEach(b=>{b.w=Math.min(b.w,G().w);b.h=Math.min(b.h,G().h);b.x=sn(Math.max(0,Math.min(b.x,G().w-b.w)));b.y=sn(Math.max(0,Math.min(b.y,G().h-b.h)))});save();render()};
 gd("w","#gw");gd("h","#gh");
 const pick=(name,lat,lon)=>{S.loc={name,lat,lon};geo=[];save();fetchWx();render()};
 $("#qs").onclick=async()=>{const q=$("#q").value.trim();if(!q)return;
  try{const j=await(await fetch("https://geocoding-api.open-meteo.com/v1/search?count=6&language=ca&name="+encodeURIComponent(q))).json();geo=j.results||[];if(!geo.length)alert("No s’ha trobat cap lloc.")}catch(e){alert("No s’ha pogut cercar.")}rCfg()};
 m.querySelectorAll("[data-gi]").forEach(e=>e.onclick=()=>{const x=geo[+e.dataset.gi];pick(x.name+(x.admin1?", "+x.admin1:""),x.latitude,x.longitude)});
 $("#gps").onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>pick("La meva ubicació",p.coords.latitude,p.coords.longitude),()=>alert("No s’ha pogut obtenir la ubicació.")):alert("Aquest navegador no ho permet.");
 $("#ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="hort-backup-"+today()+".json";a.click()};
 $("#ph").onclick=async()=>{const bt=$("#ph"),say=t=>{const x=$("#pg");if(x)x.textContent=t};bt.disabled=true;let n=0,ok=0;
  for(const k of CN){if(k=="Altre")continue;n++;say("Descarregant "+n+"/"+(CN.length-1)+"…");
   if(INFO[k]&&INFO[k].no)delete INFO[k];const i=await getInfo(k);
   if(i===null){say("Sense connexió. Torna-ho a provar més tard.");bt.disabled=false;return}
   if(i.img){ok++;try{await fetch(i.img,{mode:"cors"})}catch(e){}}}
  bt.disabled=false;say("Fet: "+ok+" fotos desades per a ús sense connexió.")};
 $("#im").onclick=()=>$("#fi").click();
 $("#fi").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const r=new FileReader();
  r.onload=()=>{let j;try{j=JSON.parse(r.result)}catch(x){}
   const gg=j&&j.garden,ok=j&&Array.isArray(j.beds)&&(gg===undefined||(gg&&+gg.w>0&&+gg.h>0));
   if(!ok){alert("Fitxer no vàlid: falten els bancals (beds) o les dimensions de l’hort (garden).");return}
   if(!confirm("Això sobreescriurà totes les dades actuals de l’app. Vols continuar?"))return;
   S=Object.assign({beds:[],rain:[],mm:{},loc:null,wx:null,garden:null},j);mig();sel=null;save();tab="map";render();toast("Dades importades")};
  r.readAsText(f)}}

/* ---- Catàleg de cultius i fotos (Viquipèdia) ---- */
let INFO={},cq="",copen=null;try{INFO=JSON.parse(localStorage.getItem("hortinfo")||"{}")}catch(e){}
const saveInfo=()=>{try{localStorage.setItem("hortinfo",JSON.stringify(INFO))}catch(e){}};
const nz=t=>t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
async function getInfo(n){const i=INFO[n];if(i&&(i.img||i.no))return i;
 for(const t of[CROPS[n][5],n]){if(!t)continue;
  try{const r=await fetch("https://ca.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(t.replace(/ /g,"_")));
   if(!r.ok)continue;const j=await r.json();if(j.type=="disambiguation"||!j.thumbnail)continue;
   INFO[n]={img:j.thumbnail.source,url:(j.content_urls&&j.content_urls.desktop&&j.content_urls.desktop.page)||""};saveInfo();return INFO[n]}
  catch(e){return null}}
 INFO[n]={no:1};saveInfo();return INFO[n]}
function phImg(e,i){e.innerHTML=`<img src="${esc(i.img)}" alt="" crossorigin="anonymous" loading="lazy" onerror="this.parentNode.innerHTML=this.parentNode.dataset.em">`}
function fillPh(root){root.querySelectorAll("[data-ph]").forEach(e=>{const n=e.dataset.ph,i=INFO[n];
 if(i&&i.img){phImg(e,i);return}if(i&&i.no)return;
 getInfo(n).then(x=>{if(x&&x.img&&e.isConnected)phImg(e,x)})})}
function cropCard(n){const c=CROPS[n],i=INFO[n]||{};
 return `<div class="cr" style="cursor:pointer"><div class="row" style="flex-wrap:nowrap"><div class="ph" data-ph="${esc(n)}" data-em="${esc(ico(n,36))}">${ico(n,48)}</div><div class="g1"><b>${esc(n)}</b>${c[5]?`<div class="mu"><i>${esc(c[5])}</i></div>`:""}<div class="mu">${esc(c[3]||"")}</div>${dem(n)===null?"":`<div class="mu">Efecte al sòl: ${DL[dem(n)]}</div>`}<div class="mu">${ic("collita",16)} Collita: ${days({crop:n}).join("–")} dies des de la sembra${c[1]>=365?" (cultiu de diversos anys)":""}${days({crop:n}).join()!=days({crop:n,m:"p"}).join()?"<br>Amb plàntula: "+days({crop:n,m:"p"}).join("–")+" dies":""}</div></div></div><div>${esc(c[4])}</div>${i.url?`<div class="mu"><a href="${esc(i.url)}" target="_blank" rel="noopener" style="color:var(--ac)">Més informació a la Viquipèdia</a></div>`:""}</div>`}
function rCat(){
 m.innerHTML=`<div class="row"><input id="cs" class="g1" type="search" placeholder="Cerca entre ${CN.length-1} cultius…" value="${esc(cq)}"></div><div id="cl"></div>`;
 const draw=()=>{const l=CN.filter(n=>n!="Altre"&&nz(n).includes(nz(cq))),cl=$("#cl");
  cl.innerHTML=l.map(n=>n==copen?cropCard(n):`<div class="hist" data-co="${esc(n)}" style="cursor:pointer;padding:8px 0"><span>${ico(n,18)} ${esc(n)}</span><span class="mu">${esc(CROPS[n][3]||"")}</span></div>`).join("")||'<div class="mu">Cap resultat.</div>';
  cl.querySelectorAll("[data-co]").forEach(e=>e.onclick=()=>{copen=e.dataset.co;draw()});
  const o=cl.querySelector(".cr");if(o){o.onclick=ev=>{if(ev.target.tagName!="A"){copen=null;draw()}};if(!cq)o.scrollIntoView({block:"center"})}
  fillPh(cl)};
 $("#cs").oninput=e=>{cq=e.target.value;draw()};draw()}

/* ---- Interacció del croquis ---- */
function wireMap(){
 const g=G(),s=SC();
 $("#add").onclick=()=>{const k=uid(),L=S.beds[S.beds.length-1],gap=.4;let w,h,x,y;
  if(L){w=L.w;h=L.h;y=L.y;x=sn(L.x+L.w+gap);if(x+w>g.w+1e-6){x=sn(Math.min(...S.beds.map(b=>b.x)));y=sn(L.y+L.h+gap)}}
  else{w=Math.min(1.2,g.w);h=Math.min(3,g.h);x=.5;y=.5}
  y=sn(Math.max(0,Math.min(g.h-h,y)));x=sn(Math.max(0,Math.min(g.w-w,x)));
  S.beds.push({id:k,name:"Bancal "+(S.beds.length+1),x,y,w,h,crops:[],log:[]});sel=k;goSheet=true;save();render()};
 $("#ed").onclick=()=>{edit=!edit;render()};
 $("#gl").onclick=e=>{e.preventDefault();tab="cfg";render()};
 $("#wall").onclick=()=>{const l=S.beds.filter(b=>(b.crops||[]).some(c=>c.sown));
  if(!l.length){toast("Cap bancal amb cultius sembrats");return}
  if(!confirm("Regar "+l.length+(l.length==1?" bancal?":" bancals?")))return;
  l.forEach(b=>(b.log=b.log||[]).push({k:uid(),t:"w",d:today()}));save();render();toast("Regat en "+l.length+(l.length==1?" bancal":" bancals"))};
 m.querySelectorAll("#sv g").forEach(e=>{
  e.onclick=()=>{if(!edit){sel=e.dataset.id;goSheet=true;render()}};
  e.onpointerdown=ev=>{if(!edit)return;const b=S.beds.find(x=>x.id==e.dataset.id),sv=$("#sv"),pt=sv.createSVGPoint();
  const at=v=>{pt.x=v.clientX;pt.y=v.clientY;return pt.matrixTransform(sv.getScreenCTM().inverse())};
  const p0=at(ev),cr=ev.target.dataset?ev.target.dataset.cr:undefined;let mv=false;e.setPointerCapture(ev.pointerId);
  if(cr!==undefined&&cr!==""){const c=b.crops[+cr],tg=ev.target,X=b.x*s,Y=b.y*s,W=b.w*s,Hh=b.h*s;
   e.onpointermove=v=>{const p=at(v),dx=p.x-p0.x,dy=p.y-p0.y;if(Math.abs(dx)+Math.abs(dy)>3)mv=true;if(mv)tg.setAttribute("transform","translate("+dx+" "+dy+")")};
   e.onpointerup=v=>{e.onpointermove=e.onpointerup=null;if(mv){const p=at(v);c.fx=Math.max(.1,Math.min(.9,(p.x-X)/W));c.fy=Math.max(.1,Math.min(.9,(p.y-Y)/Hh));save()}sel=b.id;render()};return}
  const ox=b.x,oy=b.y;
  e.onpointermove=v=>{const p=at(v),dx=p.x-p0.x,dy=p.y-p0.y;if(Math.abs(dx)+Math.abs(dy)>4)mv=true;if(!mv)return;
   b.x=sn(Math.max(0,Math.min(g.w-b.w,ox+dx/s)));b.y=sn(Math.max(0,Math.min(g.h-b.h,oy+dy/s)));
   e.setAttribute("transform","translate("+(b.x-ox)*s+" "+(b.y-oy)*s+")")};
  e.onpointerup=()=>{e.onpointermove=e.onpointerup=null;if(mv)save();sel=b.id;render()}}});
 const b=S.beds.find(x=>x.id==sel);if(!b)return;
 $("#up").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
 const ia=$("#ia");if(ia)ia.onclick=()=>{b.crops.forEach(c=>{delete c.fx;delete c.fy});save();render()};
 const pp=$("#pp");if(pp){const upd=()=>{$("#pr").innerHTML=pestRec(pp.value,+$("#pi").value)};pp.onchange=upd;$("#pi").onchange=upd}
 $("#nm").onchange=e=>{b.name=e.target.value;save();render()};
 $("#bw").onchange=e=>{b.w=Math.max(0.2,Math.min(g.w,sn(+e.target.value||b.w)));b.x=sn(Math.min(b.x,g.w-b.w));save();render()};
 $("#bh").onchange=e=>{b.h=Math.max(0.2,Math.min(g.h,sn(+e.target.value||b.h)));b.y=sn(Math.min(b.y,g.h-b.h));save();render()};
 $("#cr").onchange=e=>{const c=e.target.value;$("#addrow").hidden=!c;
  $("#pv").innerHTML=c?`<div class="mu">${ico(c,18)} ${esc(CROPS[c][4]||"")}</div>`+dline(c)+(b.crops.length?compat(pairs(b.crops.map(x=>x.crop).concat(c),c),"Amb el que ja hi ha: "):'<div class="mu">Primer cultiu del bancal.</div>')+rotPrev(b,c):""};
 m.querySelectorAll("[data-ad]").forEach(e=>e.onclick=()=>{const c=$("#cr").value;if(!c)return;
  b.crops.push({crop:c,m:$("#md").value=="p"?"p":"s",sown:e.dataset.ad=="1"?($("#sd").value||today()):""});save();render()});
 m.querySelectorAll("[data-cd]").forEach(e=>e.onclick=()=>{const c=b.crops.splice(+e.dataset.cd,1)[0];
  if(c&&c.sown)(b.log=b.log||[]).push({k:uid(),t:"h",d:today(),n:c.crop,s:c.sown,m:c.m||"s"});save();render()});
 m.querySelectorAll("[data-ci]").forEach(e=>e.onclick=()=>{cq="";copen=e.dataset.ci;tab="cat";render()});
 m.querySelectorAll("[data-cm]").forEach(e=>e.onchange=()=>{b.crops[+e.dataset.cm].m=e.value=="p"?"p":"s";save();render()});
 m.querySelectorAll("[data-cp]").forEach(e=>e.onclick=()=>{b.crops[+e.dataset.cp].sown=today();save();render()});
 m.querySelectorAll("[data-cs]").forEach(e=>e.onchange=()=>{b.crops[+e.dataset.cs].sown=e.value;save();render()});
 m.querySelectorAll("[data-cy]").forEach(e=>e.onchange=()=>{b.crops[+e.dataset.cy].days=e.value;save();render()});
 m.querySelectorAll("[data-lg]").forEach(e=>e.onclick=()=>{const t=e.dataset.lg;(b.log=b.log||[]).push({k:uid(),t,d:$("#ld").value||today(),n:t=="t"?$("#tn").value:"",...(t=="t"&&$("#pp").value!==""?{p:PESTS[+$("#pp").value].n,i:+$("#pi").value}:{})});save();render()});
 m.querySelectorAll("[data-rm]").forEach(e=>e.onclick=()=>{b.log=b.log.filter(x=>x.k!=e.dataset.rm);save();render()});
 $("#del").onclick=()=>{if(confirm("Eliminar "+b.name+"?")){S.beds=S.beds.filter(x=>x!=b);sel=null;save();render()}}}
document.querySelectorAll("nav button").forEach(e=>e.onclick=()=>{tab=e.dataset.t;if(tab=="cat")copen=null;render()});
load();render();
if(S.loc&&(!S.wx||Date.now()-S.wx.t>36e5))fetchWx();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
