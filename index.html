function dayRain(d){const r=S.rain.find(x=>x.d==d);if(r)return{lv:r.lv,mm:[0,2,10][r.lv],man:1};
 if(S.mm[d]!=null)return{lv:lvOf(S.mm[d]),mm:S.mm[d]};return null}
function lastRain(){const t=today();let best=null;
 const ds=new Set([...Object.keys(S.mm),...S.rain.map(x=>x.d)]);
 for(const d of ds){if(d>t)continue;const r=dayRain(d);if(r&&r.lv>0&&(!best||d>best.d))best={d,...r}}return best}
function mmSince(d){let s=0;const t=today();for(let x=add(d,1);x<=t;x=add(x,1)){const r=dayRain(x);if(r)s+=r.mm}return s}

  const j=await(await fetch(u)).json(),t=today();
  const days=j.daily.time.map((d,i)=>({d,mm:j.daily.precipitation_sum[i]||0,pp:j.daily.precipitation_probability_max[i],tx:j.daily.temperature_2m_max[i],tn:j.daily.temperature_2m_min[i]}));
  days.forEach(x=>{if(x.d<=t)S.mm[x.d]=x.mm});S.wx={t:Date.now(),days};wxMsg="";save()}

/* ---- Cultius i combinacions ---- */
function rate(a,b){const ba=BASE[a]||a,bb=BASE[b]||b;if(ba==bb)return 0;
 for(const[x,y]of[[a,b],[ba,b],[a,bb],[ba,bb]]){const v=CP[x+"|"+y];if(v!==undefined)return v}
 const fa=(CROPS[a]||[])[3],fb=(CROPS[b]||[])[3];if(!fa||!fb)return 0;
 const r=FR.find(([x,y])=>(x==fa&&y==fb)||(x==fb&&y==fa));return r?r[2]:0}
function span(c){if(!c.sown)return null;const e=CROPS[c.crop]||CROPS.Altre,x=c.crop=="Altre"&&c.days?+c.days:null;
 return[add(c.sown,x||e[1]),add(c.sown,x?x+20:e[2])]}
function status(b){const t=today();let st="empty";for(const c of b.crops||[]){const s=span(c);if(!s)continue;if(t>=s[0])return"ready";st="grow"}return st}
function pairs(names,only){const u=[...new Set(names)].filter(n=>n!="Altre"),o=[];
 for(let i=0;i<u.length;i++)for(let j=i+1;j<u.length;j++){if(only&&u[i]!=only&&u[j]!=only)continue;o.push([u[i],u[j],rate(u[i],u[j])])}return o}
function verdict(ps){if(!ps.length)return null;const v=ps.map(p=>p[2]);return v.includes(-1)?-1:v.includes(2)?2:v.includes(1)?1:0}
function compat(ps,title){const v=verdict(ps);if(v===null)return"";
 const V={2:"Molt bona combinació",1:"Bona combinació",0:"Combinació neutra","-1":"Convé evitar alguna parella"};
 return `<div class="v v${v}">${RT[v][0]} ${title||""}${V[v]}</div>`+ps.map(p=>`<div class="hist"><span>${CROPS[p[0]][0]} ${p[0]} + ${CROPS[p[1]][0]} ${p[1]}</span><span>${RT[p[2]][0]} ${RT[p[2]][1]}</span></div>`).join("")}
function last(b,t){const l=(b.log||[]).filter(x=>x.t==t).map(x=>x.d).sort();return l.length?l[l.length-1]:null}
const FAM={};for(const k in CROPS)if(CROPS[k][3])FAM[k]=CROPS[k][3];
function needsWater(b){
 const sw=(b.crops||[]).filter(c=>c.sown).map(c=>c.sown).sort();if(!sw.length)return null;
 const t=today(),w=last(b,"w"),ref=w||sw[0],n=diff(ref,t),nx=add(t,1),near=(S.wx?.days||[]).filter(x=>x.d==t||x.d==nx);
 const hot=near.some(x=>x.tx>25),lim=hot?3:4,mm=mmSince(ref);
 return n>lim&&mm<5&&!near.some(x=>x.mm>5)?{n,mm,hot,ref:w?"l’últim reg":"la sembra"}:null}
const ret=b=>(b.log||[]).map((x,i)=>[x,i]).filter(p=>p[0].t=="h").sort((p,q)=>p[0].d<q[0].d?1:p[0].d>q[0].d?-1:q[1]-p[1]).map(p=>p[0]);

 const pick=(name,lat,lon)=>{S.loc={name,lat,lon};geo=[];save();fetchWx();render()};
 $("#qs").onclick=async()=>{const q=$("#q").value.trim();if(!q)return;
  try{const j=await(await fetch("https://geocoding-api.open-meteo.com/v1/search?count=6&language=ca&name="+encodeURIComponent(q))).json();geo=j.results||[];if(!geo.length)alert("No s’ha trobat cap lloc.")}catch(e){alert("No s’ha pogut cercar.")}rCfg()};
 m.querySelectorAll("[data-gi]").forEach(e=>e.onclick=()=>{const x=geo[+e.dataset.gi];pick(x.name+(x.admin1?", "+x.admin1:""),x.latitude,x.longitude)});
 $("#gps").onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>pick("La meva ubicació",p.coords.latitude,p.coords.longitude),()=>alert("No s’ha pogut obtenir la ubicació.")):alert("Aquest navegador no ho permet.");
 $("#ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="hort-backup-"+today()+".json";a.click()};
 $("#ph").onclick=async()=>{const bt=$("#ph"),say=t=>{const x=$("#pg");if(x)x.textContent=t};bt.disabled=true;let n=0,ok=0;
  for(const k of CN){if(k=="Altre")continue;n++;say("Descarregant "+n+"/"+(CN.length-1)+"…");
   if(INFO[k]&&INFO[k].no)delete INFO[k];const i=await getInfo(k);
   if(i===null){say("Sense connexió. Torna-ho a provar més tard.");bt.disabled=false;return}
   if(i.img){ok++;try{await fetch(i.img,{mode:"cors"})}catch(e){}}}
  bt.disabled=false;say("Fet: "+ok+" fotos desades per a ús sense connexió.")};
 $("#im").onclick=()=>$("#fi").click();
 $("#fi").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const r=new FileReader();
  r.onload=()=>{let j;try{j=JSON.parse(r.result)}catch(x){}
   const gg=j&&j.garden,ok=j&&Array.isArray(j.beds)&&(gg===undefined||(gg&&+gg.w>0&&+gg.h>0));
   if(!ok){alert("Fitxer no vàlid: falten els bancals (beds) o les dimensions de l’hort (garden).");return}
   if(!confirm("Això sobreescriurà totes les dades actuals de l’app. Vols continuar?"))return;
   S=Object.assign({beds:[],rain:[],mm:{},loc:null,wx:null,garden:null},j);mig();sel=null;save();tab="map";render();toast("Dades importades")};
  r.readAsText(f)}}

/* ---- Catàleg de cultius i fotos (Viquipèdia) ---- */
let INFO={},cq="",copen=null;try{INFO=JSON.parse(localStorage.getItem("hortinfo")||"{}")}catch(e){}
const saveInfo=()=>{try{localStorage.setItem("hortinfo",JSON.stringify(INFO))}catch(e){}};
const nz=t=>t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
async function getInfo(n){const i=INFO[n];if(i&&(i.img||i.no))return i;
 for(const t of[CROPS[n][5],n]){if(!t)continue;
  try{const r=await fetch("https://ca.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(t.replace(/ /g,"_")));
   if(!r.ok)continue;const j=await r.json();if(j.type=="disambiguation"||!j.thumbnail)continue;
   INFO[n]={img:j.thumbnail.source,url:(j.content_urls&&j.content_urls.desktop&&j.content_urls.desktop.page)||""};saveInfo();return INFO[n]}
  catch(e){return null}}
 INFO[n]={no:1};saveInfo();return INFO[n]}
function phImg(e,i){e.innerHTML=`<img src="${esc(i.img)}" alt="" crossorigin="anonymous" loading="lazy" onerror="this.parentNode.textContent=this.parentNode.dataset.em">`}
function fillPh(root){root.querySelectorAll("[data-ph]").forEach(e=>{const n=e.dataset.ph,i=INFO[n];
 if(i&&i.img){phImg(e,i);return}if(i&&i.no)return;
 getInfo(n).then(x=>{if(x&&x.img&&e.isConnected)phImg(e,x)})})}
function cropCard(n){const c=CROPS[n],i=INFO[n]||{};
 return `<div class="cr" style="cursor:pointer"><div class="row" style="flex-wrap:nowrap"><div class="ph" data-ph="${esc(n)}" data-em="${c[0]}">${c[0]}</div><div class="g1"><b>${esc(n)}</b>${c[5]?`<div class="mu"><i>${esc(c[5])}</i></div>`:""}<div class="mu">${esc(c[3]||"")}</div><div class="mu">🧺 Collita: ${c[1]}–${c[2]} dies${c[1]>=365?" (cultiu de diversos anys)":""}</div></div></div><div>${esc(c[4])}</div>${i.url?`<div class="mu"><a href="${esc(i.url)}" target="_blank" rel="noopener" style="color:var(--ac)">Més informació a la Viquipèdia</a></div>`:""}</div>`}
function rCat(){
 m.innerHTML=`<div class="row"><input id="cs" class="g1" type="search" placeholder="Cerca entre ${CN.length-1} cultius…" value="${esc(cq)}"></div><div id="cl"></div>`;
 const draw=()=>{const l=CN.filter(n=>n!="Altre"&&nz(n).includes(nz(cq))),cl=$("#cl");
  cl.innerHTML=l.map(n=>n==copen?cropCard(n):`<div class="hist" data-co="${esc(n)}" style="cursor:pointer;padding:8px 0"><span>${CROPS[n][0]} ${esc(n)}</span><span class="mu">${esc(CROPS[n][3]||"")}</span></div>`).join("")||'<div class="mu">Cap resultat.</div>';
  cl.querySelectorAll("[data-co]").forEach(e=>e.onclick=()=>{copen=e.dataset.co;draw()});
  const o=cl.querySelector(".cr");if(o){o.onclick=ev=>{if(ev.target.tagName!="A"){copen=null;draw()}};if(!cq)o.scrollIntoView({block:"center"})}
  fillPh(cl)};
 $("#cs").oninput=e=>{cq=e.target.value;draw()};draw()}

/* ---- Interacció del croquis ---- */
function wireMap(){
 const g=G(),s=SC();
 $("#add").onclick=()=>{const k=uid(),n=S.beds.length,w=Math.min(1.2,g.w),h=Math.min(3,g.h);
  S.beds.push({id:k,name:"Bancal "+(n+1),x:sn(Math.min(g.w-w,0.5+(n%4)*1.8)),y:sn(Math.min(g.h-h,0.5+Math.floor(n/4)*3.5)),w,h,crops:[],log:[]});sel=k;save();render()};
 $("#gl").onclick=e=>{e.preventDefault();tab="cfg";render()};
 $("#wall").onclick=()=>{const l=S.beds.filter(b=>(b.crops||[]).some(c=>c.sown));
  if(!l.length){toast("Cap bancal amb cultius sembrats");return}
  if(!confirm("Regar "+l.length+(l.length==1?" bancal?":" bancals?")))return;
  l.forEach(b=>(b.log=b.log||[]).push({k:uid(),t:"w",d:today()}));save();render();toast("💧 Regat en "+l.length+(l.length==1?" bancal":" bancals"))};
 m.querySelectorAll("#sv g").forEach(e=>{e.onpointerdown=ev=>{const b=S.beds.find(x=>x.id==e.dataset.id),sv=$("#sv"),pt=sv.createSVGPoint();
  const at=v=>{pt.x=v.clientX;pt.y=v.clientY;return pt.matrixTransform(sv.getScreenCTM().inverse())};
  const p0=at(ev),ox=b.x,oy=b.y;let mv=false;e.setPointerCapture(ev.pointerId);
  e.onpointermove=v=>{const p=at(v),dx=p.x-p0.x,dy=p.y-p0.y;if(Math.abs(dx)+Math.abs(dy)>4)mv=true;if(!mv)return;
   b.x=sn(Math.max(0,Math.min(g.w-b.w,ox+dx/s)));b.y=sn(Math.max(0,Math.min(g.h-b.h,oy+dy/s)));
   const r=e.firstElementChild,t=e.querySelectorAll("text");r.setAttribute("x",b.x*s);r.setAttribute("y",b.y*s);
   t[0].setAttribute("x",(b.x+b.w/2)*s);t[0].setAttribute("y",(b.y+b.h/2)*s-4);t[1].setAttribute("x",(b.x+b.w/2)*s);t[1].setAttribute("y",(b.y+b.h)*s-6)};
  e.onpointerup=()=>{e.onpointermove=e.onpointerup=null;if(mv)save();sel=b.id;render()}}});
 const b=S.beds.find(x=>x.id==sel);if(!b)return;
 $("#nm").onchange=e=>{b.name=e.target.value;save();render()};
 $("#bw").onchange=e=>{b.w=Math.max(0.2,Math.min(g.w,sn(+e.target.value||b.w)));b.x=sn(Math.min(b.x,g.w-b.w));save();render()};
 $("#bh").onchange=e=>{b.h=Math.max(0.2,Math.min(g.h,sn(+e.target.value||b.h)));b.y=sn(Math.min(b.y,g.h-b.h));save();render()};
 $("#cr").onchange=e=>{const c=e.target.value;$("#addrow").hidden=!c;
  $("#pv").innerHTML=c?`<div class="mu">${CROPS[c][0]} ${esc(CROPS[c][4]||"")}</div>`+(b.crops.length?compat(pairs(b.crops.map(x=>x.crop).concat(c),c),"Amb el que ja hi ha: "):'<div class="mu">Primer cultiu del bancal.</div>')+rotWarn(b,c):""};
 m.querySelectorAll("[data-ad]").forEach(e=>e.onclick=()=>{const c=$("#cr").value;if(!c)return;
  b.crops.push({crop:c,sown:e.dataset.ad=="1"?($("#sd").value||today()):""});save();render()});
 m.querySelectorAll("[data-cd]").forEach(e=>e.onclick=()=>{const c=b.crops.splice(+e.dataset.cd,1)[0];
  if(c&&c.sown)(b.log=b.log||[]).push({k:uid(),t:"h",d:today(),n:c.crop,s:c.sown});save();render()});
 m.querySelectorAll("[data-ci]").forEach(e=>e.onclick=()=>{cq="";copen=e.dataset.ci;tab="cat";render()});
 m.querySelectorAll("[data-cp]").forEach(e=>e.onclick=()=>{b.crops[+e.dataset.cp].sown=today();save();render()});
 m.querySelectorAll("[data-cs]").forEach(e=>e.onchange=()=>{b.crops[+e.dataset.cs].sown=e.value;save();render()});
 m.querySelectorAll("[data-cy]").forEach(e=>e.onchange=()=>{b.crops[+e.dataset.cy].days=e.value;save();render()});
 m.querySelectorAll("[data-lg]").forEach(e=>e.onclick=()=>{const t=e.dataset.lg;(b.log=b.log||[]).push({k:uid(),t,d:$("#ld").value||today(),n:t=="t"?$("#tn").value:""});save();render()});
 m.querySelectorAll("[data-rm]").forEach(e=>e.onclick=()=>{b.log=b.log.filter(x=>x.k!=e.dataset.rm);save();render()});
 $("#del").onclick=()=>{if(confirm("Eliminar "+b.name+"?")){S.beds=S.beds.filter(x=>x!=b);sel=null;save();render()}}}
document.querySelectorAll("nav button").forEach(e=>e.onclick=()=>{tab=e.dataset.t;if(tab=="cat")copen=null;render()});
load();render();
if(S.loc&&(!S.wx||Date.now()-S.wx.t>36e5))fetchWx();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
